<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Final JavaScript</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

</head>

<body class="">
    <div class="top-bar">    
        <div class="barra-esquerda">
            <button id="login">Login 🥸</button>
            <button id="logout">Logout ❌</button>
            <button id="theme">☀️🌙</button>
        </div>    
            
        <div class="barra-centro">
            <select id="cidadeSelect" onchange="obterTempo()">
                <option value="lisboa">Lisboa</option>
                <option value="porto">Porto</option>
                <option value="coimbra">Coimbra</option>
            </select>
            <div id="weather">A carregar...</div>
        </div>    

        <div class="barra-direita">
            <p id="time-hour"></p>
        </div>
    </div>
    
    <div id="login-message"></div>

    <br><br>
    <h3>Contador de tarefas: </h3>
    <p>Ativas : <span id="ativas">0</span></p>
    <p>Concluídas: <span id="concluidas">0</span></p>
    <form id="tarefas">
        <input type="text" placeholder="Nome da tarefa" name="tarefa" id="tarefa">
        <br><br>
        <button id="add">Adicionar Tarefa</button>
        <button id="guardar" disabled>Guardar alterações</button>          
    </form>

    <p id="mensagem" role="status"></p>

    <div class="tarefas">
    <h2>Lista de Tarefas</h2> 
    <select id="select">
        <option value="todos" selected>Todos</option>
        <option value="ativo">Ativos</option>
        <option value="concluido">Concluídos</option>
    </select>    
    <ul id="lista-tarefas"></ul>  
    </div>
    

</body>

</html>
